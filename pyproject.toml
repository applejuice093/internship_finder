[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
# pyflakes, pycodestyle, import sorting and bugbear
select = ["E", "F", "W", "I", "B"]
# Long one-line data rows and the compact Streamlit layout code are intentional.
ignore = ["E501", "E701", "W291", "W293"]
